<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/monocode.png" />
    <title>MonoCode</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var hue = localStorage.getItem("monocode.themeHue");
          var sat = localStorage.getItem("monocode.themeSaturation");
          var darkLightness = localStorage.getItem(
            "monocode.themeDarkLightness",
          );
          var opacity = localStorage.getItem("monocode.sidebarOpacity");
          if (hue != null) {
            var h = Math.max(0, Math.min(360, Number(hue) || 0));
            root.style.setProperty("--theme-hue", String(h));
          }
          if (sat != null) {
            var s = Math.max(0, Math.min(100, Number(sat) || 0));
            root.style.setProperty("--theme-saturation", s + "%");
          }
          if (darkLightness != null) {
            var l = Math.max(0, Math.min(30, Number(darkLightness) || 0));
            root.style.setProperty("--theme-dark-lightness", l + "%");
          }
          if (opacity != null) {
            var o = Math.max(0.15, Math.min(1, Number(opacity) || 0.85));
            root.style.setProperty("--sidebar-opacity", String(o));
          }
          var scheme = localStorage.getItem("monocode.colorScheme");
          if (scheme === "system") {
            scheme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (scheme === "light") {
            root.classList.add("theme-light");
          }
          var bodyGlass = localStorage.getItem("monocode.bodyGlass");
          if (bodyGlass == null || bodyGlass === "1" || bodyGlass === "true") {
            root.classList.add("glass-body");
          }
          var isMac =
            typeof navigator !== "undefined" &&
            /Mac|iPhone|iPad/.test(navigator.platform);
          if (isMac) {
            root.classList.add("is-mac");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --theme-hue: 240;
        --theme-saturation: 0%;
        --theme-dark-lightness: 9%;
        --sidebar-opacity: 0.85;
        --background-lightness: var(--theme-dark-lightness);
        --color-background-base: hsl(
          var(--theme-hue) var(--theme-saturation) var(--background-lightness)
        );
      }

      html.theme-light {
        --background-lightness: 97%;
      }

      html,
      body,
      #boot-splash {
        margin: 0;
        background: var(--color-background-base);
      }

      /* Opaque cover until React paints. The logo is in HTML so it is
         visible during the Dock bounce, before the bundle runs. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        color: #fff;
        transition: opacity 260ms ease;
      }

      html.theme-light #boot-splash {
        color: #000;
      }

      #boot-splash.boot-splash-out {
        opacity: 0;
      }

      /* Keep the native drag region available before the bundle runs. */
      #boot-splash-drag-region {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        height: 40px;
        pointer-events: auto;
      }

      #boot-splash.boot-splash-out #boot-splash-drag-region {
        pointer-events: none;
      }

      #boot-splash svg {
        width: 72px;
        height: 72px;
        display: block;
        transform: scale(1);
        transition: transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      #boot-splash.boot-splash-out svg {
        transform: scale(1.06);
      }

      .boot-pop,
      .boot-center {
        transform-box: fill-box;
        transform-origin: center;
        animation: boot-pop-in 280ms cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
      }

      .boot-pop {
        animation-delay: calc(var(--i) * 25ms);
      }

      .boot-center {
        animation-name: boot-center-in;
        animation-delay: 120ms;
      }

      .boot-ring {
        animation: boot-ring-glow 960ms step-end infinite;
        animation-delay: calc(var(--i) * -120ms);
      }

      .boot-cursor {
        animation: boot-cursor-blink 1s step-end infinite;
      }

      @keyframes boot-pop-in {
        from {
          opacity: 0;
          transform: scale(0.6);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes boot-center-in {
        from {
          opacity: 0;
          transform: scale(0.85);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes boot-ring-glow {
        0%,
        100% {
          opacity: 1;
        }
        12.5% {
          opacity: 0.8;
        }
        25% {
          opacity: 0.7;
        }
        37.5% {
          opacity: 0.6;
        }
        50% {
          opacity: 0.5;
        }
        62.5% {
          opacity: 0.4;
        }
        75% {
          opacity: 0.3;
        }
        87.5% {
          opacity: 0.2;
        }
      }

      @keyframes boot-cursor-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-pop,
        .boot-center,
        .boot-ring,
        .boot-cursor {
          animation: none;
        }

        #boot-splash svg,
        #boot-splash.boot-splash-out svg {
          transform: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div id="boot-splash-drag-region" data-tauri-drag-region="deep"></div>
      <svg
        viewBox="0 0 1024 1024"
        fill="currentColor"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <mask
            id="boot-logo-cutout"
            maskUnits="userSpaceOnUse"
            x="427"
            y="427"
            width="170"
            height="170"
          >
            <rect x="427" y="427" width="170" height="170" fill="#fff" />
            <polyline
              points="476,479 504,506 476,534"
              fill="none"
              stroke="#000"
              stroke-width="13"
              stroke-linejoin="miter"
            />
            <rect
              class="boot-cursor"
              x="506"
              y="537"
              width="49"
              height="13"
              fill="#000"
            />
          </mask>
        </defs>
        <g class="boot-pop" style="--i: 0">
          <rect
            class="boot-ring"
            x="143"
            y="313"
            width="169"
            height="169"
            opacity="1"
          />
        </g>
        <g class="boot-pop" style="--i: 1">
          <rect
            class="boot-ring"
            x="312"
            y="144"
            width="169"
            height="169"
            opacity=".8"
          />
        </g>
        <g class="boot-pop" style="--i: 2">
          <rect
            class="boot-ring"
            x="543"
            y="144"
            width="169"
            height="169"
            opacity=".7"
          />
        </g>
        <g class="boot-pop" style="--i: 3">
          <rect
            class="boot-ring"
            x="712"
            y="313"
            width="169"
            height="169"
            opacity=".6"
          />
        </g>
        <g class="boot-pop" style="--i: 4">
          <rect
            class="boot-ring"
            x="712"
            y="543"
            width="169"
            height="169"
            opacity=".5"
          />
        </g>
        <g class="boot-pop" style="--i: 5">
          <rect
            class="boot-ring"
            x="543"
            y="712"
            width="169"
            height="169"
            opacity=".4"
          />
        </g>
        <g class="boot-pop" style="--i: 6">
          <rect
            class="boot-ring"
            x="312"
            y="712"
            width="169"
            height="169"
            opacity=".3"
          />
        </g>
        <g class="boot-pop" style="--i: 7">
          <rect
            class="boot-ring"
            x="143"
            y="543"
            width="169"
            height="169"
            opacity=".2"
          />
        </g>
        <g class="boot-center">
          <rect
            x="427"
            y="427"
            width="170"
            height="170"
            mask="url(#boot-logo-cutout)"
          />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
