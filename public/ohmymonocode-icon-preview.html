<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ohmymonocode · 图标动效</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #eceef2; background: #111317; }
    body { margin: 0; min-height: 100svh; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid #4099ff; outline-offset: 5px; }
    .page { max-width: 1000px; margin: auto; padding: 36px 32px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { font: 600 17px ui-monospace, monospace; letter-spacing: -.6px; }
    .version { color: #9299a7; font: 12px ui-monospace, monospace; }
    main { display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 64px; margin: 64px 0 48px; }
    .stage { aspect-ratio: 1; background: #191c22; border: 1px solid #2b303a; border-radius: 32px; display: grid; place-items: center; position: relative; }
    .stage.light { background: #ebece9; border-color: #d4d7d4; }
    .hero { display: block; width: 83%; aspect-ratio: 1; background: none; border: 0; padding: 0; }
    .hero svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .hint { position: absolute; bottom: 16px; font-size: 11px; color: #8d95a4; pointer-events: none; }
    .light .hint { color: #5c6270; }
    .eyebrow { color: #67acff; font: 11px ui-monospace, monospace; letter-spacing: 2px; margin: 0 0 16px; }
    h1 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -1.3px; line-height: 1.2; margin: 0 0 18px; font-weight: 620; }
    .intro { color: #a6adba; font-size: 14px; line-height: 1.85; margin: 0 0 30px; max-width: 340px; }
    code { color: #ededeb; font-family: ui-monospace, monospace; }
    .states { display: flex; gap: 6px; padding: 5px; border-radius: 12px; background: #20242b; width: fit-content; }
    .state { color: #a6adba; background: none; border: 0; border-radius: 8px; padding: 9px 20px; font-size: 13px; }
    .state[aria-pressed="true"] { background: #383f4b; color: #fff; }
    .description { min-height: 44px; color: #a6adba; font-size: 12px; line-height: 1.8; margin: 16px 0 0; }
    .controls { display: flex; gap: 20px; margin-top: 15px; }
    .text-button { color: #c9ced8; background: none; border: 0; padding: 5px 0; font-size: 12px; text-decoration: underline; text-underline-offset: 5px; text-decoration-color: #626b7c; }
    .reduced { color: #8d95a4; font-size: 11px; line-height: 1.7; }
    .sizes { border-top: 1px solid #2b303a; padding-top: 26px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .size-label { color: #9299a7; font-size: 12px; }
    .size-list { display: flex; align-items: center; gap: 26px; }
    figure { margin: 0; display: grid; justify-items: center; gap: 8px; }
    figure svg { display: block; }
    figcaption { color: #9299a7; font: 10px ui-monospace, monospace; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 18px; margin-top: 38px; color: #7e8797; font-size: 11px; line-height: 1.8; }
    .downloads { display: flex; gap: 20px; }
    a { color: #b5c9e7; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (max-width: 700px) {
      .page { padding: 24px 22px; }
      main { grid-template-columns: 1fr; gap: 30px; margin: 32px 0; }
      .stage { width: min(100%, 370px); margin: auto; }
      .intro { max-width: none; margin-bottom: 22px; }
      h1 { font-size: 30px; }
      .size-list { gap: 14px; }
    }
  </style>

  <style>
  .omc-motion :is(.float, .squash, .gaze, .eye, .cursor) { transform-box: view-box; }
  .omc-motion .squash { transform-origin: 128px 190px; }
  .omc-motion .eye-left { transform-origin: 89px 132px; }
  .omc-motion .eye-right { transform-origin: 167px 132px; }
  .omc-motion .cursor { transform-origin: 128px 152px; }
  .omc-motion .float { animation: omc-float 4.8s ease-in-out infinite; }
  .omc-motion .eye { animation: omc-blink 5.6s linear infinite; }
  .omc-motion .cursor { animation: omc-cursor 1.6s steps(1, end) infinite; }
  .omc-motion[data-state="thinking"] .float { animation-duration: 3.2s; }
  .omc-motion[data-state="thinking"] .gaze { animation: omc-look 2.4s ease-in-out infinite; }
  .omc-motion[data-state="thinking"] .cursor { animation: omc-type 1.2s steps(3, end) infinite; }
  .omc-motion[data-state="done"] .float { animation: omc-hop 1.2s ease-in-out 2; }
  .omc-motion[data-state="done"] .squash { animation: omc-squash 1.2s ease-in-out 2; }
  .omc-motion[data-state="done"] .eye { animation: omc-happy 1.2s ease-in-out 2; }
  .omc-motion[data-state="done"] .cursor { animation: omc-smile 1.2s ease-in-out 2; }
  .omc-motion[data-paused="true"] * { animation-play-state: paused !important; }
  @keyframes omc-float {
    0%, 100% { transform: translateY(2px); }
    50% { transform: translateY(-4px); }
  }
  @keyframes omc-blink {
    0%, 40%, 44%, 100% { transform: scaleY(1); }
    42% { transform: scaleY(.08); }
  }
  @keyframes omc-cursor { 0%, 65%, 100% { opacity: 1; } 66% { opacity: .28; } }
  @keyframes omc-look {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  @keyframes omc-type {
    0%, 100% { transform: scaleX(.5); opacity: .55; }
    65% { transform: scaleX(1); opacity: 1; }
  }
  @keyframes omc-hop {
    0%, 18%, 58%, 100% { transform: translateY(0); }
    36% { transform: translateY(-17px); }
    77% { transform: translateY(-5px); }
  }
  @keyframes omc-squash {
    0%, 36%, 77%, 100% { transform: scale(1); }
    18% { transform: scale(1.04, .92); }
    58% { transform: scale(1.05, .91); }
  }
  @keyframes omc-happy {
    0%, 100% { transform: scaleY(1); }
    30%, 75% { transform: scaleY(.7); }
  }
  @keyframes omc-smile {
    0%, 100% { transform: scaleX(1); }
    35%, 75% { transform: scaleX(1.15); }
  }
  @media (prefers-reduced-motion: reduce) {
    .omc-motion :is(.float, .squash, .gaze, .eye, .cursor) { animation: none !important; }
  }
</style>

  <script>
    const icon = document.querySelector('.hero svg');
    const description = document.querySelector('.description');
    const pause = document.querySelector('.pause');
    const stateButtons = [...document.querySelectorAll('[data-mode]')];
    const descriptions = {
      idle: '轻轻浮动、偶尔眨眼，光标缓缓闪烁。',
      thinking: '视线左右移动，光标有节奏地伸缩。',
      done: '轻轻蓄力、弹跳两次，再安静落下。'
    };
    let paused = false;
    function setState(state) {
      icon.dataset.state = state;
      // Replay finite animations when the selected state is clicked again.
      for (const animation of icon.getAnimations({ subtree: true })) animation.currentTime = 0;
      stateButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === state)));
      description.textContent = descriptions[state];
    }
    stateButtons.forEach(button => button.addEventListener('click', () => setState(button.dataset.mode)));
    document.querySelector('.hero').addEventListener('click', () => setState('done'));
    pause.addEventListener('click', () => {
      paused = !paused;
      icon.dataset.paused = String(paused);
      pause.setAttribute('aria-pressed', String(paused));
      pause.textContent = paused ? '播放动画' : '暂停动画';
    });
    document.querySelector('.backdrop').addEventListener('click', event => {
      const light = document.querySelector('.stage').classList.toggle('light');
      event.currentTarget.setAttribute('aria-pressed', String(light));
      event.currentTarget.textContent = light ? '深色背景' : '浅色背景';
    });
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    function updateReducedMotion() {
      document.querySelector('.reduced').hidden = !reduced.matches;
      pause.hidden = reduced.matches;
    }
    reduced.addEventListener('change', updateReducedMotion);
    updateReducedMotion();
  </script>
