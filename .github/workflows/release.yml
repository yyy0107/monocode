name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps-debian.sh
      - run: npm ci
      - name: Verify release version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = process.env.GITHUB_REF_NAME.slice(1);
          const pkg = JSON.parse(readFileSync('package.json')).version;
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json')).version;
          const cargo = readFileSync('Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          if (![pkg, config, cargo].every(value => value === version)) throw new Error('Release tag and application versions differ');
          if (!readFileSync('CHANGELOG.md', 'utf8').includes(`## [${version}]`)) throw new Error('Missing changelog section');
          NODE
      - name: Verify web and Rust tests
        if: runner.os == 'Linux'
        run: |
          npm run check:web
          cargo test --locked
      - name: Build desktop installer
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.fork.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.dmg
          if-no-files-found: error

  rpm:
    name: Linux RPM (Enterprise Linux 10)
    runs-on: ubuntu-latest
    container: almalinux:10
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/install-linux-deps-fedora.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tauri build --bundles rpm --config src-tauri/tauri.fork.conf.json
      - name: Verify RPM installation
        run: |
          set -euo pipefail
          packages=(target/release/bundle/rpm/*.rpm)
          test "${#packages[@]}" -eq 1
          dnf install -y "${packages[0]}"
          command -v monocode
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-rpm
          path: target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  host:
    name: Standalone Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:host
      - run: npm run host:package -- --all
      - uses: actions/upload-artifact@v4
        with:
          name: host-packages
          path: |
            build/host-packages/*.tar.gz
            build/host-packages/*.zip
            build/host-packages/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [desktop, rpm, host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true
      - name: Verify and stage release assets
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, mkdirSync, copyFileSync, writeFileSync } from 'node:fs';
          import { join, basename } from 'node:path';
          import { createHash } from 'node:crypto';
          function walk(dir) {
            return readdirSync(dir, {withFileTypes:true}).flatMap(entry => entry.isDirectory() ? walk(join(dir,entry.name)) : [join(dir,entry.name)]);
          }
          const files = walk('downloaded');
          const names = files.map(file => basename(file));
          if (new Set(names).size !== names.length) throw new Error('Duplicate release asset names');
          const installers = names.filter(name => /\.(deb|AppImage|rpm|exe|dmg)$/.test(name));
          const archives = names.filter(name => /^monocode-host-.*\.(tar\.gz|zip)$/.test(name));
          if (installers.length !== 6 || archives.length !== 6 || !archives.every(name => names.includes(`${name}.sha256`))) throw new Error('Release assets are incomplete');
          mkdirSync('release-assets');
          const checksums = [];
          for (const file of files.sort()) {
            const name = basename(file);
            const data = readFileSync(file);
            if (!data.length) throw new Error(`Empty release asset: ${name}`);
            copyFileSync(file, join('release-assets', name));
            checksums.push(`${createHash('sha256').update(data).digest('hex')}  ${name}`);
          }
          writeFileSync('release-assets/SHA256SUMS', checksums.join('\n')+'\n');
          NODE
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --draft --title "MonoCode ${tag#v} · 中文切换版" --notes-file .github/release-notes-zh.md
          fi
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$tag" release-assets/* --clobber
            gh release view "$tag" --json assets > release-state.json
            node --input-type=module -e '
              import { readFileSync, readdirSync } from "node:fs";
              const uploaded = new Set(JSON.parse(readFileSync("release-state.json")).assets.map(asset => asset.name));
              for (const name of readdirSync("release-assets")) if (!uploaded.has(name)) throw new Error(`Missing uploaded asset: ${name}`);
            '
            gh release edit "$tag" --draft=false --latest
          fi
          gh release view "$tag" --json url,isDraft,assets
